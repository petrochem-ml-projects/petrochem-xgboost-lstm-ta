name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --all-extras
      - run: uv run mypy .

  unit-tests:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --all-extras
      - run: >
          uv run pytest -m unit -q
          --cov --cov-report=xml --cov-report=html --cov-report=term-missing
      - run: uv run coverage report
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-html-report
          path: htmlcov/
      - if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v4.1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --all-extras
      - run: uv run pytest -m integration -q

  docs-check:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --all-extras
      - run: uv run interrogate .

  docker-build:
    needs: unit-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: data_generator
            dockerfile: data_generator/Dockerfile
          - service: pipeline
            dockerfile: ml_pipeline/Dockerfile
          - service: serving
            dockerfile: serving/Dockerfile
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build ${{ matrix.service }} image (skipped if Dockerfile absent)
        if: hashFiles(matrix.dockerfile) != ''
        run: docker build -f ${{ matrix.dockerfile }} -t ci-${{ matrix.service }}:${{ github.sha }} .

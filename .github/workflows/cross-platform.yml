name: Cross-platform unit tests

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  cross-platform-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
        - uses: actions/checkout@v7.0.1
        - uses: astral-sh/setup-uv@v9.0.0
          with:
            enable-cache: true
        - run: uv sync --all-extras
        - run: uv run pytest -m unit

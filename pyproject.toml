[project]
name = "petrochem-xgboost-lstm-ta"
version = "0.0.1"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pandas>=2.1",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "typer>=0.12",
]

[project.optional-dependencies]
generator = []                                     # covered by core deps
eda = ["matplotlib", "scipy", "statsmodels"]
preprocessing = ["scikit-learn", "xgboost", "pandera"]
torch = ["torch"]
keras = ["tensorflow"]
training = ["optuna", "mlflow"]
orchestration = ["apache-airflow"]
serving = ["fastapi", "uvicorn[standard]", "prometheus-fastapi-instrumentator"]
rag = ["sentence-transformers", "pgvector"]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
    "testcontainers",
    "interrogate",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "D", "ARG", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "testcontainers.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, isolated tests with no external services",
    "integration: tests against a real Postgres (testcontainers)",
    "pipeline: end-to-end dvc/airflow smoke tests",
    "e2e: full-stack tests over live HTTP",
]

[tool.coverage.run]
source = ["config", "data_generator", "ml_pipeline", "serving"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.interrogate]
fail-under = 80
verbose = 2
exclude = ["tests", ".venv"]
ignore-init-module = false
